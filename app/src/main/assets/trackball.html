<style>
:root{--bg1:#0d1117;--bg2:#05070b;--ink:#9db0bf;--tile:#121a24;--tile-line:#243445;--acc:#c9d3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.mouse canvas{position:absolute;left:18.75%;top:13.04%;width:45%;height:39.13%;border-radius:50%;cursor:grab;touch-action:none;will-change:transform}
.mouse canvas.drag{cursor:grabbing;box-shadow:0 0 14px var(--acc)}
.key{cursor:pointer;transition:transform .08s,filter .08s;transform-box:fill-box}
.key.pressed{transform:translateY(2.5px);filter:brightness(.85)}
.mouse[data-s=glass] .key>.b{fill:url(#kyg);stroke:var(--acc);stroke-opacity:.9}
.mouse[data-s=holo] .key>.b{fill:url(#kyh);fill-opacity:.85;stroke:var(--acc)}

.rip.r{border-style:dashed}

.dlg{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92vw,330px);max-height:80vh;overflow:auto;z-index:50;padding:14px 16px 16px;border-radius:30px 18px 34px 22px;color:#dfe9f0;touch-action:pan-y;background:linear-gradient(160deg,#4a535e,#12161c);border:2px solid #aeb8c1;box-shadow:0 22px 40px rgba(0,0,0,.55)}
.dlg[hidden]{display:none}

.hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.r{display:flex;justify-content:space-between;font-size:12px;margin:12px 0 5px}
.dlg input{width:100%;accent-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.dlg button{font:inherit;font-size:12px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 11px;cursor:pointer;touch-action:manipulation}
.dlg button.sel{border-color:var(--acc);color:var(--acc)}
#wh{cursor:ns-resize;touch-action:none}
#wh.tap{filter:brightness(1.5)!important}
.mouse[data-s=classic] #wh{filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}

html.and body{background:transparent;gap:0}
html.and .targets,html.and #cur{display:none!important}
html.and .mouse{width:auto;height:min(100vh,115vw);max-width:100vw}

html.and{background:transparent}
html.and .mouse svg{filter:drop-shadow(0 8px 6px rgba(0,0,0,.55))}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mgrid button{padding:9px 8px;border-radius:14px;text-align:center}
.mgrid button.wide{grid-column:1/-1}
html.pm body{justify-content:flex-start;gap:6px;padding-top:6px}
html.and.pm .mouse{height:24vh;flex:none;max-width:60vw}
html.pm .dlg{position:static;transform:none;width:calc(100vw - 16px);max-width:none;max-height:none;flex:1 1 auto;min-height:0;margin:0 8px 8px;overflow:auto}
</style>

<script>
(function(){
  var cv=document.getElementById('ball'),ctx=cv.getContext('2d'),S=360,C=180,R=150,K=1/83,SENS=2.4,i;
  var dirty=true,SK0,FIT0,pts=[];
  for(i=0;i<420;i++){
    var x=Math.random()*2-1,y=Math.random()*2-1,z=Math.random()*2-1,l=Math.hypot(x,y,z);
    if(l<.1||l>1){i--;continue}
    pts.push({k:Math.random(),x:x/l,y:y/l,z:z/l,s:.6+Math.random()*1.7,a:.35+Math.random()*.65});
  }
  var COL=[['Циан','#35e0ff'],['Розовый','#ff3df0'],['Лайм','#8cff3a'],['Жёлтый','#ffe83a'],['Оранжевый','#ff7a2e'],['Фиолет','#a766ff']].map(function(a){
    var n=parseInt(a[1].slice(1),16),r=n>>16,g=n>>8&255,b=n&255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b),h=mx==r?(g-b)/d*60:mx==g?(b-r)/d*60+120:(r-g)/d*60+240;
    return{hex:a[1],rgb:r+','+g+','+b,h:(h+360)%360}});
  var STY=['classic','glass','holo','bubble'],NEON=COL[0],ST='classic',spin=0;
  var root=document.documentElement,mouse=document.getElementById('mouse'),dlg=document.getElementById('dlg'),db=document.getElementById('db');

  function rot(dx,dy){
    spin+=dx-dy;dirty=true;
    var t=dx*K,f=-dy*K,ct=Math.cos(t),st=Math.sin(t),cp=Math.cos(f),sp=Math.sin(f);
    for(var j=0;j<pts.length;j++){var p=pts[j],x1=p.x*ct+p.z*st,z1=-p.x*st+p.z*ct;
      p.x=x1;var y2=p.y*cp-z1*sp;p.z=p.y*sp+z1*cp;p.y=y2;}
  }
  function hc(v,a,l){var h=NEON?NEON.h+Math.sin(v)*45:v*57.3;return 'hsla('+(((h%360)+360)%360)+',100%,'+(l||62)+'%,'+a+')'}
  function disc(){ctx.beginPath();ctx.arc(C,C,R,0,6.2832)}
  function spec(k){
    ctx.save();ctx.globalAlpha=k;ctx.lineCap='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.7)';
    ctx.beginPath();ctx.arc(C,C,R*.84,3.45,4.35);ctx.stroke();
    ctx.translate(C-.42*R,C-.5*R);ctx.rotate(-.7);ctx.scale(1.6,.7);
    var h=ctx.createRadialGradient(0,0,0,0,0,R*.3);h.addColorStop(0,'rgba(255,255,255,.95)');h.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=h;ctx.beginPath();ctx.arc(0,0,R*.3,0,6.2832);ctx.fill();ctx.restore();
  }
  function drawClassic(){
    ctx.clearRect(0,0,S,S);
    var g=ctx.createRadialGradient(C-.3*R,C-.35*R,R*.05,C,C,R);g.addColorStop(0,'#3d4959');g.addColorStop(.55,'#0f141c');g.addColorStop(1,'#030507');
    ctx.fillStyle=g;disc();ctx.fill();
    for(var j=0;j<pts.length;j++){var p=pts[j];if(p.z<=0)continue;
      ctx.fillStyle='rgba('+(NEON&&p.k<.3?NEON.rgb:'215,224,234')+','+(p.a*p.z).toFixed(2)+')';
      ctx.beginPath();ctx.arc(C+p.x*R*.98,C+p.y*R*.98,p.s*(.4+.6*p.z)*1.8,0,6.2832);ctx.fill();}
    var v=ctx.createRadialGradient(C,C,R*.6,C,C,R);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');
    ctx.fillStyle=v;disc();ctx.fill();
    var h=ctx.createRadialGradient(C-.38*R,C-.42*R,0,C-.38*R,C-.42*R,R*.55);
    h.addColorStop(0,'rgba(255,255,255,.55)');h.addColorStop(.4,'rgba(200,240,255,.15)');h.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=h;disc();ctx.fill();
  }
  function drawGlass(){
    ctx.clearRect(0,0,S,S);var t=NEON?NEON.rgb:'200,235,255';
    var g=ctx.createRadialGradient(C,C,R*.2,C,C,R);
    g.addColorStop(0,'rgba('+t+',.05)');g.addColorStop(.8,'rgba('+t+',.16)');g.addColorStop(1,'rgba('+t+',.5)');
    ctx.fillStyle=g;disc();ctx.fill();
    for(var j=0;j<pts.length;j++){var p=pts[j];if(p.k>.5)continue;
      ctx.fillStyle='rgba('+t+','+(p.a*.6*(p.z>0?1:.4)).toFixed(2)+')';
      ctx.beginPath();ctx.arc(C+p.x*R*.9,C+p.y*R*.9,p.s*1.3*(.7+.3*p.z),0,6.2832);ctx.fill();}
    var c2=ctx.createRadialGradient(C+.35*R,C+.45*R,0,C+.35*R,C+.45*R,R*.6);
    c2.addColorStop(0,'rgba('+t+',.45)');c2.addColorStop(1,'rgba('+t+',0)');
    ctx.fillStyle=c2;disc();ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(C,C,R-1.5,0,6.2832);ctx.stroke();
    spec(1);
  }
  function drawHolo(){
    ctx.clearRect(0,0,S,S);
    var g=ctx.createRadialGradient(C-.2*R,C-.25*R,0,C,C,R);g.addColorStop(0,'#1a2233');g.addColorStop(1,'#04060b');
    ctx.fillStyle=g;disc();ctx.fill();
    ctx.save();disc();ctx.clip();ctx.globalCompositeOperation='lighter';
    if(ctx.createConicGradient){var cg=ctx.createConicGradient(spin*.02,C,C);
      for(var s=0;s<=6;s++)cg.addColorStop(s/6,hc(s*1.0472+spin*.02,.3));
      ctx.fillStyle=cg;ctx.fillRect(0,0,S,S);}
    for(var j=0;j<pts.length;j++){var p=pts[j];if(p.z<=0)continue;
      ctx.fillStyle=hc(p.x*2+p.y*1.5+p.z+spin*.03,p.a*p.z*.9);
      ctx.beginPath();ctx.arc(C+p.x*R*.98,C+p.y*R*.98,p.s*2.2*(.4+.6*p.z),0,6.2832);ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.05)';for(var y=0;y<S;y+=8)ctx.fillRect(0,y,S,2);
    ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle=hc(spin*.03,.8);disc();ctx.stroke();
    spec(.6);
  }
  function drawBubble(){
    ctx.clearRect(0,0,S,S);var t=NEON?NEON.rgb:'210,235,255';
    var g=ctx.createRadialGradient(C,C,R*.5,C,C,R);
    g.addColorStop(0,'rgba('+t+',.02)');g.addColorStop(.85,'rgba('+t+',.1)');g.addColorStop(1,'rgba('+t+',.35)');
    ctx.fillStyle=g;disc();ctx.fill();
    ctx.save();disc();ctx.clip();ctx.globalCompositeOperation='lighter';
    if(ctx.createConicGradient){var cg=ctx.createConicGradient(spin*.015,C,C);
      for(var s=0;s<=6;s++)cg.addColorStop(s/6,hc(s*1.0472+spin*.015,.2,75));
      ctx.fillStyle=cg;ctx.fillRect(0,0,S,S);}
    for(var j=0;j<pts.length;j++){var p=pts[j];if(p.k>.3||p.z<=0)continue;
      ctx.fillStyle=hc(p.x*3+p.y*2+spin*.02,.03+.09*p.z,75);
      ctx.beginPath();ctx.arc(C+p.x*R*.9,C+p.y*R*.9,p.s*9*(.5+.5*p.z),0,6.2832);ctx.fill();}

    ctx.lineWidth=4;ctx.strokeStyle=hc(spin*.02,.6,78);disc();ctx.stroke();
    ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(C,C,R*.84,.35,.95);ctx.stroke();

  }
  function draw(){ST=='glass'?drawGlass():ST=='holo'?drawHolo():ST=='bubble'?drawBubble():drawClassic()}

  /* ===== курсор: в браузере рисуется здесь, в приложении — нативным оверлеем ===== */
  var AND=!!window.Android,DPR=window.devicePixelRatio||1;
  var cur=document.getElementById('cur'),cx=innerWidth/2,cy=innerHeight/2,hov=null,
      CUR={sh:'arrow',st:'fill',col:AND?'#35e0ff':'#ffffff',glow:0,sz:AND?40:28},SENS=2.4,ROT=0,WS=1;
  var P=function(a,o){return 'M'+a.map(function(q){return (q[0]*2+o)+' '+(q[1]*2+o)}).join('L')+'Z'};
  var SH={arrow:{d:'M3 2L3 23L8.5 18L12.5 27L16 25.5L12 16.8L19.5 16.8Z',x:3,y:2},
    sharp:{d:'M10 7.7L23.4 20.8H15.7L10 26.1Z',x:10,y:7.7},
    hand:{d:P([[5,0],[7,0],[7,5],[9,5],[9,6],[11,6],[11,7],[13,7],[13,12],[12,12],[12,15],[6,15],[6,14],[4,12],[2,10],[2,9],[1,9],[1,8],[3,8],[4,9],[4,10],[5,10]],1),x:12,y:1,j:'miter'},
    dot:{d:'M9 16a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z',x:16,y:16},
    ring:{d:'M7 16a9 9 0 1 0 18 0a9 9 0 1 0 -18 0Z',x:16,y:16,line:1},
    cross:{d:'M16 3V12M16 20V29M3 16H12M20 16H29',x:16,y:16,line:1},
    ibeam:{d:'M11 4H21M16 4V28M11 28H21',x:16,y:16,line:1},
    dia:{d:'M16 4L28 16L16 28L4 16Z',x:16,y:16},
    tri:{d:'M16 4L28 27H4Z',x:16,y:16}};
  function pth(d,f,k,w,j){return '<path d="'+d+'" style="fill:'+f+';stroke:'+k+'" stroke-width="'+w+'" stroke-linejoin="'+(j||'round')+'" stroke-linecap="round"/>'}
  function drawCur(){
    if(AND)return;
    var s=SH[CUR.sh],c=CUR.col,st=CUR.st,h;
    if(s.line||st=='line')h=pth(s.d,'none','#06232b',5.5,s.j)+pth(s.d,'none',c,2.6,s.j);

    cur.style.filter=CUR.glow?'drop-shadow(0 0 3px '+c+') drop-shadow(0 0 8px '+c+')':'none';place();
  }
  function place(){var s=SH[CUR.sh],f=CUR.sz/32;cur.style.transform='translate('+(cx-s.x*f)+'px,'+(cy-s.y*f)+'px)'}

  /* ===== состояние: в приложении хранится на стороне Android ===== */
  var INFO={};
  if(AND){try{INFO=JSON.parse(Android.getInfo())||{}}catch(e){}
    if(INFO.sens)SENS=INFO.sens;if(INFO.ws)WS=INFO.ws;
    try{var S0=Android.getState();if(S0){var o0=JSON.parse(S0);
      if(o0.ST)ST=o0.ST;if(o0.neon!=null)NEON=o0.neon>=0?COL[o0.neon]||null:null;
      if(o0.rot!=null)ROT=o0.rot;if(o0.sk)SK0=o0.sk;if(o0.fit)FIT0=o0.fit;
      if(o0.cur)for(var k0 in o0.cur)CUR[k0]=o0.cur[k0];
    }}catch(e){}}
  var st_t=0;

  }

  /* ===== движение: дельты копятся и уходят в Android один раз за кадр ===== */
  var pdx=0,pdy=0;
  function move(dx,dy){
    rot(dx,dy);
    if(AND){pdx+=dx*DPR;pdy+=dy*DPR;return}

    place();
    var el=document.elementFromPoint(cx,cy),t=el&&el.closest&&el.closest('.tgt');

  }
  function flush(){if(AND&&(pdx||pdy)){var a=pdx,b=pdy;pdx=pdy=0;Android.onMove(a,b)}}

  /* ===== шар ===== */
  var drag=false,lx=0,ly=0,vx=0,vy=0,lt=0;
  cv.addEventListener('pointerdown',function(e){if(AND)Android.onBallDown();drag=true;lx=e.clientX;ly=e.clientY;vx=vy=0;lt=performance.now();cv.classList.add('drag');cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;move(dx,dy);vx=vx*.5+dx*.5;vy=vy*.5+dy*.5;lt=performance.now();e.preventDefault();});
  function up(){if(!drag)return;flush();if(AND)Android.onBallUp();drag=false;cv.classList.remove('drag');if(performance.now()-lt>80)vx=vy=0;}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function loop(){
    if(!drag&&Math.abs(vx)+Math.abs(vy)>.05){move(vx,vy);vx*=.95;vy*=.95;}else if(!drag){vx=vy=0;}

    if(dirty){dirty=false;draw()}
    requestAnimationFrame(loop);
  }

  /* ===== колесо прокрутки ===== */
  var wh=document.getElementById('wh'),wr=document.getElementById('wrib'),WN=20,WR=35,WCY=232,wa=0,wv=0,wdrag=false,wly=0,wlt=0,wmv=0,ribs=[];
  for(var wi=0;wi<WN;wi++){var rc=document.createElementNS('http://www.w3.org/2000/svg','rect');rc.setAttribute('x',305);rc.setAttribute('width',20);rc.setAttribute('fill','#aab5bf');wr.appendChild(rc);ribs.push(rc)}
  function drawWheel(){
    for(var j=0;j<WN;j++){
      var th=wa+j*6.2832/WN,cs=Math.cos(th),rc=ribs[j];
      if(cs<=.04){rc.setAttribute('visibility','hidden');continue}
      var h=5.6*cs;rc.setAttribute('visibility','visible');
      rc.setAttribute('y',(WCY+WR*Math.sin(th)-h/2).toFixed(2));rc.setAttribute('height',h.toFixed(2));
      rc.setAttribute('opacity',(.35+.65*cs).toFixed(2));
    }
  }
  function scrollAt(px){

    el.dispatchEvent(new WheelEvent('wheel',{deltaY:px,deltaMode:0,clientX:cx,clientY:cy,bubbles:true,cancelable:true}));
    for(var n=el;n&&n!==document.documentElement;n=n.parentElement){
      var o=getComputedStyle(n).overflowY;
      if((o=='auto'||o=='scroll')&&n.scrollHeight>n.clientHeight){n.scrollTop+=px;return}
    }
  }
  function wheelMove(px){
    var k=mouse.getBoundingClientRect().width/400||.75;
    wa=(wa+px/(k*WR))%6.2832;drawWheel();if(AND)Android.onWheel(px*DPR);else scrollAt(px);
  }
  function wheelStep(){
    if(!wdrag&&!AND&&Math.abs(wv)>.15){wheelMove(wv);wv*=.955}else if(!wdrag){wv=0}
  }
  wh.addEventListener('pointerdown',function(e){if(AND)Android.onWheelStart();wdrag=true;wly=e.clientY;wv=0;wmv=0;wlt=performance.now();wh.setPointerCapture(e.pointerId);e.preventDefault()});
  wh.addEventListener('pointermove',function(e){
    if(!wdrag)return;var dy=e.clientY-wly;wly=e.clientY;wmv+=Math.abs(dy);
    if(dy)wheelMove(dy);wv=wv*.5+dy*.5;wlt=performance.now();e.preventDefault();
  });
  function wup(){
    if(!wdrag)return;wdrag=false;if(AND){Android.onWheelEnd();wv=0}
    if(wmv<6){
      [].forEach.call(document.querySelectorAll('.tgt'),function(t){t.classList.remove('on','alt')});
      wh.classList.add('tap');setTimeout(function(){wh.classList.remove('tap')},120);wv=0;
    }else if(performance.now()-wlt>80)wv=0;
  }
  wh.addEventListener('pointerup',wup);wh.addEventListener('pointercancel',wup);
  wh.addEventListener('wheel',function(e){if(!e.isTrusted)return;e.preventDefault();wv=0;wheelMove(e.deltaY*(e.deltaMode==1?16:1))},{passive:false});
  drawWheel();

  /* ===== кнопки корпуса ===== */
  function click(right){
    if(AND)return;
    var r=document.createElement('div');r.className='rip'+(right?' r':'');r.style.left=cx+'px';r.style.top=cy+'px';document.body.appendChild(r);
    r.addEventListener('animationend',function(){r.remove()});
    var el=document.elementFromPoint(cx,cy),t=el&&el.closest&&el.closest('.tgt');
    if(t)t.classList.toggle(right?'alt':'on');
  }
  function apply(){
    mouse.dataset.s=dlg.dataset.s=menu.dataset.s=ST;
    root.style.setProperty('--acc',NEON?NEON.hex:'#c9d3dc');
    document.getElementById('kcdot').style.fill=NEON?NEON.hex:'#8a96a2';
    dirty=true;saveState();
  }
  function bind(id,fn){var b=document.getElementById(id);
    b.addEventListener('pointerdown',function(e){b.classList.add('pressed');fn();e.preventDefault()});
    ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){b.classList.remove('pressed')})})}

  /* ===== панели: меню (двойной тап по ЛКМ) и настройки ===== */
  var menu=document.createElement('div');menu.className='dlg';menu.id='menu';menu.hidden=true;
  menu.innerHTML='<div class="hd"><span>Меню трекбола</span><button id="mx">✕</button></div><div id="mb"></div>';
  document.body.appendChild(menu);
  var mb=menu.querySelector('#mb'),MBT={};

  }
  function closePanel(){

    if(root.classList.contains('pm')){root.classList.remove('pm');if(AND)Android.onPanel(0)}
  }
  function refreshFlags(){if(!AND)return;try{var o=JSON.parse(Android.getInfo());setFlags(o.locked,o.sel)}catch(e){}}

  };
  function mact(n){

  }
  function msec(t){var d=document.createElement('div');d.className='r';d.innerHTML='<span>'+t+'</span>';mb.appendChild(d);var g=document.createElement('div');g.className='mgrid';mb.appendChild(g);return g}
  function mbtn(g,id,label,wide){var b=document.createElement('button');b.textContent=label;if(wide)b.className='wide';b.onclick=function(){mact(id)};g.appendChild(b);MBT[id]=b}
  var g1=msec('Режим');mbtn(g1,'touchpad','🖱 Обычный тачпад',1);
  var g2=msec('Окно');
  mbtn(g2,'set','⚙ Настройки трекбола',1);mbtn(g2,'appset','⚙ Настройки приложения',1);
  mbtn(g2,'lock','🔓 Свободный');mbtn(g2,'sel','Ab Выделение');
  mbtn(g2,'files','📁 Файлы');mbtn(g2,'kb','⌨ Клавиатура');
  mbtn(g2,'close','✕ Скрыть трекбол',1);
  var g3=msec('Правка');
  [['undo','Отменить'],['redo','Повторить'],['cut','Вырезать'],['copy','Копировать'],['paste','Вставить'],['delete','Удалить'],['all','Выделить всё']].forEach(function(a){mbtn(g3,a[0],a[1])});
  menu.querySelector('#mx').onclick=closePanel;

  var lastKl=0,klDbl=false;
  function openSet(){if(AND){if(dlg.hidden||!root.classList.contains('pm'))openPanel('set');else closePanel()}else dlg.hidden=!dlg.hidden}
  if(AND){
    var KL=document.getElementById('kl'),KR=document.getElementById('kr'),SV=document.querySelector('.mouse svg');
    KL.addEventListener('pointerdown',function(){
      var n=performance.now();
      if(n-lastKl<380){klDbl=true;lastKl=0;openPanel('menu');return}   /* второй тап: открыть меню вместо клика */
      klDbl=false;lastKl=n;Android.onLeft(1);
    });
    ['pointerup','pointercancel'].forEach(function(n){KL.addEventListener(n,function(){if(klDbl){klDbl=false;return}Android.onLeft(0)})});

    /* корпус трекбола (всё, что не кнопки и не колесо) таскает окно целиком */

  }
  bind('kl',function(){click(0)});
  bind('kr',function(){click(1)});
  bind('ks',function(){ST=STY[(STY.indexOf(ST)+1)%STY.length];apply()});
  bind('kc',function(){var n=(NEON?COL.indexOf(NEON):-1)+1;NEON=n>=COL.length?null:COL[n];apply()});
  bind('kg',openSet);
  document.getElementById('dx').onclick=function(){if(AND)closePanel();else dlg.hidden=true};

  /* ===== скины ===== */
  var SKINS={plain:null,gr:'tb_skin_gr.jpg',hx:'tb_skin_hx.jpg',sk:'tb_skin_sk.jpg',gh:'tb_skin_gh.jpg',mb:'tb_skin_mb.jpg',b1:'tb_skin_b1.jpg',b2:'tb_skin_b2.jpg',rb:'tb_skin_rb.jpg'},SK=(typeof SK0!='undefined'&&SK0)||'b1',FIT=(typeof FIT0!='undefined'&&FIT0)||'none';
  function applySkin(){var g=document.getElementById('skg'),im=document.getElementById('skin');
    if(!SKINS[SK]){g.style.display='none';return}
    g.style.display='';im.setAttribute('href',SKINS[SK]);im.setAttribute('preserveAspectRatio',FIT);}

  /* ===== окно настроек ===== */
  function slider(lab,min,max,step,val,fn,fmt){
    var w=document.createElement('label');
    w.innerHTML='<div class="r"><span>'+lab+'</span><b>'+fmt(val)+'</b></div><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">';
    var inp=w.querySelector('input'),b=w.querySelector('b');
    inp.oninput=function(){b.textContent=fmt(+inp.value);fn(+inp.value);saveState()};db.appendChild(w);
  }
  var MARKS=[];
  function group(lab,items,get,set){
    var w=document.createElement('div'),row=document.createElement('div');
    w.innerHTML='<div class="r"><span>'+lab+'</span></div>';row.className='seg';
    function mark(){[].forEach.call(row.children,function(b){b.classList.toggle('sel',b.dataset.v==get())})}
    items.forEach(function(it){var b=document.createElement('button');b.textContent=it[1];b.dataset.v=it[0];b.onclick=function(){set(it[0]);MARKS.forEach(function(m){m()});saveState()};row.appendChild(b)});
    w.appendChild(row);db.appendChild(w);MARKS.push(mark);mark();
  }
  function setRot(v){ROT=v;mouse.style.transform=v?'rotate('+v+'deg)':''}

  slider('Чувствительность',.5,6,.1,SENS,function(v){SENS=v},function(v){return Math.round(v*400)+' PPI'});
  slider('Размер трекбола',.6,1.5,.05,WS,setWidth,function(v){return Math.round(v*100)+'%'});
  slider('Поворот трекбола',-180,180,5,ROT,setRot,function(v){return v+'°'});
  slider('Размер курсора',16,64,2,CUR.sz,function(v){CUR.sz=v;drawCur()},function(v){return v+' px'});
  var PRE=[['classic','Классика',{sh:'arrow',st:'fill',col:'#ffffff',glow:0}],['pix','Пиксельная рука',{sh:'hand',st:'dark',col:'#2bff2b',glow:0}],['neon','Неон красный',{sh:'sharp',st:'dark',col:'#ff1a1a',glow:1}],['cy','Неон циан',{sh:'sharp',st:'line',col:'#35e0ff',glow:1}]];
  group('Готовые курсоры',PRE.map(function(q){return [q[0],q[1]]}),function(){return ''},function(v){var q=PRE.filter(function(z){return z[0]==v})[0][2];for(var k in q)CUR[k]=q[k];drawCur()});
  group('Форма курсора',[['arrow','Стрелка'],['sharp','Острая'],['hand','Рука'],['dot','Точка'],['ring','Кольцо'],['cross','Прицел'],['ibeam','Текст'],['dia','Ромб'],['tri','Треугольник']],function(){return CUR.sh},function(v){CUR.sh=v;drawCur()});
  group('Стиль курсора',[['fill','Заливка'],['dark','Тёмный'],['line','Контур']],function(){return CUR.st},function(v){CUR.st=v;drawCur()});
  group('Цвет курсора',[['#ffffff','Белый'],['#2bff2b','Зелёный'],['#ff1a1a','Красный'],['#35e0ff','Циан'],['#ffe83a','Жёлтый'],['#ff3df0','Розовый']],function(){return CUR.col},function(v){CUR.col=v;drawCur()});
  group('Свечение курсора',[['0','Выкл'],['1','Вкл']],function(){return String(CUR.glow)},function(v){CUR.glow=+v;drawCur()});
  group('Стиль трекбола',[['classic','Классика'],['glass','Стекло'],['holo','Голограмма'],['bubble','Пузырь']],function(){return ST},function(v){ST=v;apply()});
  group('Подсветка трекбола',COL.map(function(c,i){return [String(i),c.hex==COL[0].hex?'Циан':['','Розовый','Лайм','Жёлтый','Оранжевый','Фиолет'][i]]}).concat([['-1','Выкл']]),function(){return String(NEON?COL.indexOf(NEON):-1)},function(v){NEON=+v>=0?COL[+v]:null;apply()});
  group('Раскраска трекбола',[['plain','Обычный'],['b1','Пляж сзади'],['b2','Пляж спереди'],['rb','Робот'],['hx','Неоновые соты'],['sk','Череп'],['gh','Серые соты'],['mb','Мрамор'],['gr','Зелёные соты']],function(){return SK},function(v){SK=v;applySkin()});
  group('Картинка на корпусе',[['none','Растянуть'],['xMidYMid slice','Обрезать']],function(){return FIT},function(v){FIT=v;applySkin()});
  addEventListener('resize',function(){cx=Math.min(cx,innerWidth-2);cy=Math.min(cy,innerHeight-2);place();dirty=true});
  rot(40,-25);setRot(ROT);apply();applySkin();drawCur();
  if(AND)saveState();   /* первый раз передаём курсор и настройки в приложение */
  loop();
})();
