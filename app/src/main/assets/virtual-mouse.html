<div id="toast" role="status"></div>
<script>
(function(){
  var st={overlay:false,accessibility:false,enableKeyboard:false,pickKeyboard:false,running:false}, stopped=false;
  var act2key={overlay:'overlay',accessibility:'accessibility',enableKeyboard:'enableKeyboard',pickKeyboard:'pickKeyboard',stop:'running'};
  var names={overlay:'Разрешить поверх окон',accessibility:'Включить Accessibility',enableKeyboard:'Включить клавиатуру',pickKeyboard:'Выбрать клавиатуру',stop:'Стоп'};
  var toast=document.getElementById('toast'),tm;
  function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on')},1500)}
  function render(){
    document.querySelectorAll('[data-k]').forEach(function(e){e.classList.toggle('on',!!st[e.dataset.k])});
    document.querySelectorAll('.btn').forEach(function(b){b.classList.toggle('on',!!st[act2key[b.dataset.action]])});
  }
  function auto(){ if(st.overlay&&st.accessibility&&st.enableKeyboard&&st.pickKeyboard&&!stopped) st.running=true; if(!(st.overlay&&st.accessibility&&st.enableKeyboard&&st.pickKeyboard)) st.running=false; }
  /* Android -> страница: window.setState({overlay:true, accessibility:true, enableKeyboard:true, pickKeyboard:true, running:true}) */
  window.setState=function(o){for(var k in o) if(k in st) st[k]=!!o[k]; render()};
  document.querySelectorAll('.btn').forEach(function(b){
    b.addEventListener('click',function(){
      var a=b.dataset.action, br=window.Android||window.AndroidBridge;
      if(br&&typeof br[a]==='function'){try{br[a]()}catch(e){say('Ошибка: '+a)} return}
      /* демо без Android */
      if(a==='stop'){ stopped=true; st.running=false; say('Оверлей остановлен'); }
      else{ var k=act2key[a]; st[k]=!st[k]; stopped=false; auto(); say(names[a]+(st[k]?' ✓':'')); }
      render();
    });
  });
  render();
})();
</script>
